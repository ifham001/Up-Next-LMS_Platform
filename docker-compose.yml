services:
  postgres:
    image: postgres:16-alpine
    container_name: upnext-lms-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5434:5432"
    volumes:
      - upnext_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  upnext_pg_data:
